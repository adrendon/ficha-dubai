<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title"></title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#0051d5",
            "brand-light": "#316bf3",
            "brand-surface": "#eef4ff",
            "surface": "#f8f9ff",
            "surface-alt": "#ffffff",
            "on-surface": "#0b1c30",
            "on-surface-secondary": "#46464d",
            "on-surface-muted": "#76767e",
            "border": "#e2e8f0",
            "border-light": "#f1f5f9",
            "whatsapp": "#25D366",
          },
          fontFamily: {
            display: ["Plus Jakarta Sans", "Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
          },
        },
      },
    };
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B30BBB8XHP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-B30BBB8XHP');
  </script>
</head>
<body class="bg-surface text-on-surface antialiased">

  <!-- Hero -->
  <header class="relative h-[70vh] min-h-[480px] w-full overflow-hidden flex items-end pb-14 px-4 md:px-10">
    <img id="hero-image" alt="" class="absolute inset-0 w-full h-full object-cover scale-105" src=""/>
    <div class="absolute inset-0 bg-gradient-to-br from-brand/30 to-transparent mix-blend-multiply"></div>
    <div class="absolute inset-0 hero-overlay"></div>
    <div class="relative max-w-[1280px] mx-auto w-full">
      <div class="flex items-center gap-3 mb-3">
        <span class="bg-white/10 backdrop-blur-md border border-white/20 text-white px-4 py-1.5 rounded-full text-xs font-medium uppercase tracking-widest" id="hero-badge-label"></span>
        <span class="text-white/70 flex items-center text-sm">
          <span class="material-symbols-outlined mr-1 text-[16px]">location_on</span>
          <span id="hero-location"></span>
        </span>
      </div>
      <h1 id="hero-title" class="text-[28px] md:text-[52px] font-display font-bold text-white mb-5 leading-tight tracking-tight"></h1>
      <div class="flex flex-wrap gap-2" id="hero-badges"></div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-[1280px] mx-auto px-4 md:px-10 py-12">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

      <!-- Left Column -->
      <div class="lg:col-span-8 flex flex-col gap-8">

        <!-- Price (mobile only) -->
        <div class="lg:hidden bg-surface-alt rounded-2xl p-6 shadow-lg border border-border-light text-center" id="price-mobile"></div>

        <!-- Tour (mobile only, right after price) -->
        <section class="lg:hidden bg-surface-alt rounded-2xl p-6 shadow-lg border border-border-light text-center" id="tour-mobile"></section>

        <!-- Gallery -->
        <section>
          <div class="gallery-grid" id="gallery-grid"></div>
          <div class="gallery-mobile">
            <div class="gallery-mobile-track" id="gallery-mobile-track"></div>
            <div class="flex justify-center items-center gap-2 mt-3">
              <span class="text-on-surface-muted text-xs" id="gallery-mobile-counter"></span>
              <span class="text-on-surface-muted text-xs" id="gallery-desliza-label"></span>
            </div>
          </div>
          <div class="thumb-strip mt-1.5 hidden md:flex" id="gallery-thumbs"></div>
          <button id="gallery-see-all" class="mt-3 w-full md:w-auto px-6 py-2.5 bg-surface-alt border border-border rounded-xl text-sm font-semibold text-on-surface hover:bg-border-light transition-colors flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">grid_view</span>
            <span id="gallery-see-all-text"></span>
          </button>
        </section>

        <!-- Description -->
        <section class="bg-surface-alt rounded-2xl p-7 md:p-9 shadow-lg border border-border-light">
          <h2 class="text-xl font-display font-bold mb-4 flex items-center gap-2" id="sec-descripcion-title"></h2>
          <div class="text-on-surface-secondary leading-relaxed text-[15px]" id="property-description"></div>
        </section>

        <!-- Destacados + Ficha/Gastos -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <section class="bg-surface-alt rounded-2xl p-7 shadow-lg border border-border-light">
            <h3 class="text-lg font-display font-bold mb-4 flex items-center gap-2" id="sec-destacados-title"></h3>
            <div class="flex flex-col gap-2.5" id="property-highlights"></div>
          </section>
          <div class="flex flex-col gap-6">
            <section class="bg-surface-alt rounded-2xl p-7 shadow-lg border border-border-light">
              <h3 class="text-lg font-display font-bold mb-4 flex items-center gap-2" id="sec-ficha-title"></h3>
              <div id="property-ficha"></div>
            </section>
            <section class="bg-surface-alt rounded-2xl p-7 shadow-lg border border-border-light">
              <h3 class="text-lg font-display font-bold mb-4 flex items-center gap-2" id="sec-gastos-title"></h3>
              <div id="property-gastos"></div>
            </section>
          </div>
        </div>

        <!-- Map (desktop only) -->
        <section class="bg-surface-alt rounded-2xl p-7 md:p-9 shadow-lg border border-border-light hidden lg:block" id="map-section-desktop">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-display font-bold flex items-center gap-2" id="sec-ubicacion-title-desktop"></h2>
            <a id="map-link-desktop" class="text-brand font-semibold text-sm flex items-center gap-1 hover:underline" href="#" target="_blank" rel="noopener">
              <span id="map-btn-text-desktop"></span> <span class="material-symbols-outlined text-[16px]">open_in_new</span>
            </a>
          </div>
          <p class="text-on-surface-secondary text-sm mb-4" id="map-address-desktop"></p>
          <div class="w-full h-80 rounded-2xl overflow-hidden" id="map-preview-desktop"></div>
        </section>
      </div>

      <!-- Right Sidebar -->
      <aside class="lg:col-span-4">
        <div class="lg:sticky lg:top-4 flex flex-col gap-5">
          <div class="bg-surface-alt rounded-2xl p-6 shadow-xl border border-border-light text-center hidden lg:block" id="sidebar-price-card"></div>
          <div class="bg-surface-alt rounded-2xl p-6 shadow-xl border border-border-light text-center hidden lg:block" id="sidebar-tour"></div>
          <div class="bg-surface-alt rounded-2xl p-6 shadow-xl border border-border-light" id="sidebar-contact"></div>
        </div>
      </aside>

    </div>

    <!-- Map (mobile only, last) -->
    <section class="bg-surface-alt rounded-2xl p-7 md:p-9 shadow-lg border border-border-light mt-10 lg:hidden" id="map-section-mobile">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-display font-bold flex items-center gap-2" id="sec-ubicacion-title-mobile"></h2>
        <a id="map-link-mobile" class="text-brand font-semibold text-sm flex items-center gap-1 hover:underline" href="#" target="_blank" rel="noopener">
          <span id="map-btn-text-mobile"></span> <span class="material-symbols-outlined text-[16px]">open_in_new</span>
        </a>
      </div>
      <p class="text-on-surface-secondary text-sm mb-4" id="map-address-mobile"></p>
      <div class="w-full h-72 rounded-2xl overflow-hidden" id="map-preview-mobile"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="max-w-[1280px] mx-auto px-4 md:px-10 py-10 border-t border-border text-center text-on-surface-muted text-xs">
    <p id="footer-copy"></p>
  </footer>

  <!-- Lightbox -->
  <div class="fixed inset-0 z-[100] hidden flex-col items-center justify-center bg-black/95" id="lightbox">
    <button id="lb-close" class="absolute top-4 right-4 p-3 rounded-full bg-white/10 hover:bg-white/20 text-white z-10">
      <span class="material-symbols-outlined text-2xl">close</span>
    </button>
    <button id="lb-prev" class="absolute left-3 md:left-6 top-1/2 -translate-y-1/2 p-3 md:p-4 rounded-full bg-white/15 hover:bg-white/25 text-white z-10 transition-colors">
      <span class="material-symbols-outlined text-2xl md:text-3xl">chevron_left</span>
    </button>
    <button id="lb-next" class="absolute right-3 md:right-6 top-1/2 -translate-y-1/2 p-3 md:p-4 rounded-full bg-white/15 hover:bg-white/25 text-white z-10 transition-colors">
      <span class="material-symbols-outlined text-2xl md:text-3xl">chevron_right</span>
    </button>
    <img id="lb-img" class="max-w-[92vw] max-h-[70vh] object-contain rounded-xl" src="" alt=""/>
    <div class="mt-4 flex flex-col items-center gap-3 w-full max-w-[90vw]">
      <span id="lb-counter" class="bg-white/10 text-white/80 px-4 py-1.5 rounded-full text-sm font-medium"></span>
      <div class="flex gap-2 overflow-x-auto py-2 px-1 max-w-full" id="lb-thumbs"></div>
      <p class="text-white/40 text-xs md:hidden" id="lb-hint"></p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
